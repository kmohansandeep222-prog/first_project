<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Hub</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <!--Navbar-->
    <header>
         <h1>Burger Hub 🍔</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <!--Hero section-->
    <section class="hero">
       <h2> Delicious Burgers, Made Fresh!</h2>
       <p>Order your favourite burgers now</p>
       <button>Order Now</button>
    </section>

    <!--Menu section-->
    <section class="menu">
        <h2>Our specials</h2>

        <div class="menu-container">

            <div class="card">
              <img src="images/classic_burger.jpg" alt="Burger">
              <h3>Classic Burger</h3>
              <p>Juciy Beef patty with fressh veggies</p>
              <span>₹149/-</span>
            </div>
            <div class="card">
              <img src="images/cheese_burger.avif" alt="Burger">
              <h3>Chesse Burger</h3>
              <p>loaded with melted chesse</p>
              <span>₹179/-</span>
            </div>

            <div class="card">
                <img src="images/chicken_buger.webp" alt="Buger">
                <h3>Chicken burger</h3>
                <p>Crispy chicken with spicy sauce</p>
                <span>₹159/-</span>
            </div>

        </div>
    </section>

    <!--footer-->
    <footer>
        <p>©</p>
    </footer>

</body>
</html>
